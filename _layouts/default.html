<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - {{ site.title | default: "Mostafa Mubashir Hossain" }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/images/dp.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="{{ '/' | relative_url }}" class="nav-home-btn">Home</a>
      
      <nav class="nav-links">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#publications">Publications</a>
        <a href="#education">Education</a>
        <a href="#achievements">Achievements</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <p>&copy; {{ 'now' | date: "%Y" }} Mostafa Mubashir Hossain (Galeeb). All rights reserved.</p>
      <div class="footer-links">
        <a href="https://github.com/SlyGaleeb" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      const siteName = "{{ site.title | default: 'Mostafa Mubashir Hossain' }}";
      const sectionTitles = {
        'about': 'About',
        'projects': 'Projects',
        'publications': 'Publications',
        'education': 'Education',
        'achievements': 'Achievements'
      };

      const sections = document.querySelectorAll('#about, #projects, #publications, #education, #achievements');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            if (sectionTitles[id]) {
              document.title = `${sectionTitles[id]} - ${siteName}`;
            }
          }
        });
      }, {
        rootMargin: '-30% 0px -60% 0px'
      });

      sections.forEach(section => observer.observe(section));

      window.addEventListener('scroll', () => {
        if (window.scrollY < 120) {
          document.title = `Home - ${siteName}`;
        }
      });
    })();
  </script>

</body>
</html>
